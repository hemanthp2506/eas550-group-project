[project]
name = "olist-pipeline"
version = "0.1.0"
description = "Relational source schema and validated, rerun-safe ingestion of the Olist e-commerce dataset into PostgreSQL."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
olist-ingest = "olist_pipeline.ingest:main"
olist-verify = "olist_pipeline.verify:main"
olist-db = "olist_pipeline.db:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "sqlfluff>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
